name: Prepare release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify the immutable local candidate
        run: ./gradlew prepareRelease verifyRelease --no-daemon --max-workers=2
      - name: Install a virtual display for consumer checks
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1
      - name: Exercise both packaged binary consumers in Minecraft
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          pane_version=$(sed -n 's/^version=//p' gradle.properties)
          xvfb-run -a python3 scripts/verify_release_consumer.py "build/release/$pane_version" --smoke
      - name: Preserve consumer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panelib-release-consumer-diagnostics
          if-no-files-found: ignore
          path: |
            build/release-consumer/**/*.log
            build/release-consumer/**/verification.json
            pane/build/test-results/test/*.xml
      - uses: actions/upload-artifact@v4
        with:
          name: panelib-release-candidate
          path: build/release/
