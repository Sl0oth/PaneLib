name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and verify artifacts
        run: ./gradlew clean build :pane:verifyPaneArtifact --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: panelib-build
          path: |
            pane/build/libs/*.jar
            pane-demo/build/libs/*.jar
