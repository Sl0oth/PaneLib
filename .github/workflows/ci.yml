name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Keep fixture capture on the workflow-owned display
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cp tools/fixtures/external-display.init.gradle "$HOME/.gradle/init.d/panelib-external-display.gradle"
      - name: Build, test tooling and compile the independent consumer
        timeout-minutes: 35
        shell: python
        run: |
          import json, os, platform, subprocess, sys
          from pathlib import Path

          root = Path.cwd()
          evidence = root / 'platform-evidence'
          evidence.mkdir(exist_ok=True)
          record = {
              'revision': os.environ['GITHUB_SHA'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'runnerOs': os.environ['RUNNER_OS'],
              'runnerArch': os.environ['RUNNER_ARCH'],
              'runnerImage': os.environ.get('ImageOS'),
              'runnerImageVersion': os.environ.get('ImageVersion'),
              'platform': platform.platform(),
              'python': sys.version,
              'checks': [],
          }

          def save_record():
              (evidence / 'environment-and-checks.json').write_text(
                  json.dumps(record, indent=2) + '\n', encoding='utf-8')

          def run(label, command):
              print('Running ' + label, flush=True)
              with (evidence / (label + '.log')).open('wb') as log:
                  process = subprocess.Popen(command, cwd=root, stdout=subprocess.PIPE,
                                             stderr=subprocess.STDOUT)
                  for line in process.stdout:
                      log.write(line)
                      log.flush()
                      sys.stdout.buffer.write(line)
                      sys.stdout.buffer.flush()
                  code = process.wait()
              record['checks'].append({'name': label, 'exitCode': code})
              save_record()
              if code:
                  raise SystemExit(code)

          save_record()
          wrapper = str(root / ('gradlew.bat' if os.name == 'nt' else 'gradlew'))
          java = Path(os.environ['JAVA_HOME']) / 'bin' / ('java.exe' if os.name == 'nt' else 'java')
          common = ['--no-daemon', '--max-workers=2', '--console=plain', '--stacktrace']
          run('java-version', [str(java), '-version'])
          run('build-and-unit-tests', [wrapper, 'clean', 'build', ':pane:verifyPaneArtifact', *common])
          run('release-tooling-tests', [sys.executable, '-m', 'unittest', 'discover', '-s', 'scripts/tests', '-v'])
          run('fixture-tooling-tests', [sys.executable, '-m', 'unittest', 'discover', '-s', 'tools/fixtures/tests', '-v'])
          properties = dict(line.split('=', 1) for line in (root / 'gradle.properties').read_text().splitlines()
                            if '=' in line and not line.lstrip().startswith('#'))
          version = properties['version'].strip()
          jar = root / 'pane' / 'build' / 'libs' / ('panelib-' + version + '.jar')
          if not jar.is_file():
              raise SystemExit('Missing runtime for independent consumer: ' + str(jar))
          run('independent-consumer-build', [wrapper, '-p', 'examples/first-screen', 'build',
                                             '-PpaneJar=' + str(jar), *common])
      - name: Record artifact hashes
        if: always()
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path

          root = Path.cwd()
          evidence = root / 'platform-evidence'
          evidence.mkdir(exist_ok=True)
          artifacts = []
          for directory in ('pane/build/libs', 'pane-demo/build/libs', 'examples/first-screen/build/libs'):
              for jar in sorted((root / directory).glob('*.jar')):
                  data = jar.read_bytes()
                  artifacts.append({'path': jar.relative_to(root).as_posix(), 'size': len(data),
                                    'sha256': hashlib.sha256(data).hexdigest()})
          (evidence / 'artifact-hashes.json').write_text(json.dumps(artifacts, indent=2) + '\n', encoding='utf-8')
      - name: Preserve platform build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panelib-platform-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            platform-evidence/
            pane/build/test-results/test/*.xml
            pane/build/reports/tests/test/
            examples/first-screen/build/reports/
      - name: Install a virtual display for client checks
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1
      - name: Exercise input in an isolated Minecraft client
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: xvfb-run -a ./gradlew :pane-demo:runClient -Pisolated -PapiTest --no-daemon
      - name: Exercise wrapping, nested focus, dropdowns and scroll state
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: xvfb-run -a ./gradlew :pane-demo:runClient -Pisolated -PreviewTest --no-daemon
      - name: Exercise bounded popup navigation and resizing
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: xvfb-run -a ./gradlew :pane-demo:runClient -Pisolated -PpopupTest --no-daemon
      - name: Animation ownership and routing checks
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: xvfb-run -a ./gradlew :pane-demo:runClient -Pisolated -PanimationTest --no-daemon

      - name: Keyboard and pointer editing acceptance
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: xvfb-run -a ./gradlew :pane-demo:runClient -Pisolated -PeditingTest --no-daemon
      - name: Resource reload and dynamic image checks
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: xvfb-run -a ./gradlew :pane-demo:runClient -Pisolated -PresourceTest --no-daemon
      - name: Independent textarea browsing checks
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: xvfb-run -a ./gradlew :pane-demo:runClient -Pisolated -PeditorTest --no-daemon
      - name: Responsive dialog client checks
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew :pane-demo:runClient -Pisolated -PdialogTest --no-daemon
      - name: Screen adoption, pointer lifetime and singleplayer pause
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: xvfb-run -a ./gradlew :pane-demo:runClient -Pisolated -PadoptionTest --no-daemon
      - name: Exercise the independent binary consumer
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          pane_version=$(sed -n 's/^version=//p' gradle.properties)
          xvfb-run -a ./gradlew -p examples/first-screen runClient -PsmokeTest -PpaneJar="$GITHUB_WORKSPACE/pane/build/libs/panelib-$pane_version.jar" --no-daemon
      - name: Preserve client diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: panelib-client-diagnostics
          if-no-files-found: ignore
          path: |
            pane-demo/build/fixture-logs/*.log
            pane-demo/run-benchmark/logs/latest.log
            pane-demo/run-benchmark/screenshots/*.png
            pane-demo/run-adoption/logs/latest.log
            pane-demo/run-adoption/screenshots/*.png
            examples/first-screen/run-example-smoke/logs/latest.log
            examples/first-screen/run-example-smoke/screenshots/*.png
            pane/build/test-results/test/*.xml
      - uses: actions/upload-artifact@v4
        with:
          name: panelib-build-${{ matrix.os }}
          path: |
            pane/build/libs/*.jar
            pane-demo/build/libs/*.jar
