plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
    apply plugin: 'net.fabricmc.fabric-loom'
    apply plugin: 'maven-publish'

    group = rootProject.group
    version = rootProject.version
    def resolvedProjectVersion = version.toString()

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    }

    processResources {
        inputs.property 'version', resolvedProjectVersion
        filesMatching('fabric.mod.json') {
            expand 'version': resolvedProjectVersion
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    tasks.withType(JavaExec).configureEach {
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    tasks.withType(Javadoc).configureEach {
        // -Pdoclint=all (or e.g. all,-missing) lints the public documentation; releases build quietly.
        options.addStringOption("Xdoclint:${project.findProperty('doclint') ?: 'none'}", '-quiet')
        if (project.hasProperty('doclint')) options.addStringOption('Xmaxwarns', '100000')
        options.addBooleanOption('notimestamp', true)
    }
}


// Local candidate preparation only. These tasks never contact a publishing service.
def releasePython = providers.gradleProperty('pythonExecutable').getOrElse(
    System.getProperty('os.name').startsWith('Windows') ? 'python' : 'python3')
tasks.register('verifyReleaseTooling', Exec) {
    group = 'verification'
    description = 'Run isolated packaging regression tests without publishing.'
    commandLine releasePython, '-m', 'unittest', 'discover', '-s', 'scripts/tests', '-v'
}
tasks.register('prepareRelease', Exec) {
    group = 'distribution'
    description = 'Build and verify an immutable local candidate with matching starter and Maven repository.'
    dependsOn 'verifyReleaseTooling', ':pane:build', ':pane-demo:build', ':pane:publishMavenJavaPublicationToLocalBuildRepository'
    commandLine releasePython, 'scripts/prepare_release.py'
}
tasks.register('verifyRelease', Exec) {
    group = 'verification'
    description = 'Verify the existing candidate archives, metadata and checksum inventory.'
    // Preserve standalone verification; order after preparation only when both are requested.
    mustRunAfter 'prepareRelease'
    commandLine releasePython, 'scripts/prepare_release.py', '--verify', "build/release/${version}"
}
