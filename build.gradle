plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

loom {
    splitEnvironmentSourceSets()
    mods {
        'client_ui_demo' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    client {
        java {
            // Preserved for a future optional browser add-on, not part of the native base artifact.
            exclude 'dev/clientui/api/ClientUiComponents.java'
            exclude 'dev/clientui/api/ClientUiDocument.java'
            exclude 'dev/clientui/api/ClientUiPage.java'
            exclude 'dev/clientui/api/ClientUiScreen.java'
            exclude 'dev/clientui/api/ClientUiTheme.java'
            exclude 'dev/clientui/demo/DemoShowcase.java'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('runClient') {
    if (project.hasProperty('demoPage')) {
        systemProperty 'clientui.demo.page', project.property('demoPage')
    }
    // Dev-only: loads a throwaway world and captures every page in-world. See DemoAutoTest.
    if (project.hasProperty('autotest')) {
        systemProperty 'clientui.demo.autotest', 'true'
    }
}
