// The Pane library: public API and a resource-reload lifecycle hook, with no demo code.
// Client-only, so a single main source set keeps the artifact consumable by other projects.

base {
    archivesName = 'panelib'
}

loom {
    mods {
        'panelib' {
            sourceSet sourceSets.main
        }
    }
}

java {
    withJavadocJar()
}

sourceSets {
    main {
        java {
            // Preserved for a future optional browser add-on, not part of the native artifact.
            exclude 'dev/pane/mcef/**'
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'panelib'
            from components.java
            pom {
                name = 'PaneLib'
                description = 'A native, retained-mode Fabric UI library for desktop-quality Minecraft screens.'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit'
                    }
                }
                developers {
                    developer {
                        id = 'sl0oth'
                        name = 'Sl0oth'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'localBuild'
            url = rootProject.layout.buildDirectory.dir('maven')
        }
    }
}

tasks.register('verifyPaneArtifact') {
    dependsOn tasks.named('jar')
    doLast {
        def artifact = tasks.named('jar').get().archiveFile.get().asFile
        def entries = zipTree(artifact).matching { include '**/*' }.files.collect {
            it.path.replace('\\', '/')
        }
        def forbidden = entries.findAll { it.contains('/dev/pane/demo/') || it.contains('/dev/pane/mcef/') }
        if (!forbidden.isEmpty()) throw new GradleException("Pane artifact contains excluded classes: ${forbidden}")
        if (!zipTree(artifact).matching { include 'LICENSE' }.files) {
            throw new GradleException('Pane artifact is missing its license notice')
        }
        if (!zipTree(artifact).matching { include 'dev/pane/ui/UiScreen.class' }.files) {
            throw new GradleException('Pane artifact is missing the public native renderer')
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyPaneArtifact')
}

// The library installs no UI. Runs happen from :pane-demo, so plain `gradlew runClient`
// launches exactly one client instead of two.
tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    enabled = false
}

// Every distributed archive carries the license, including sources and Javadoc.
tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE'))
}

// Explicit matched CPU workload; not part of normal tests and not an FPS claim.
tasks.register('textBenchmark', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.pane.ui.TextBenchmark'
    systemProperty 'java.awt.headless', 'true'
}

tasks.register('warmTextBenchmark', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = project.hasProperty('textBaselineJar')
        ? files(rootProject.file(project.property('textBaselineJar')), sourceSets.test.runtimeClasspath)
        : sourceSets.test.runtimeClasspath
    mainClass = 'dev.pane.ui.WarmTextBenchmark'
    systemProperty 'java.awt.headless', 'true'
}
